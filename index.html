:root{--bg:#fcfaf6;--c:#fff;--ink:#2f4368;--mu:#788daa;--ln:#f1ede5;--b:#202f49;--bl:#f6f4ee;--b2:#d9d2c5;--ok:#1f8a7d;--wn:#a86f0c;--bd:#d6446c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131a27;--c:#1b273b;--ink:#f5f3ed;--mu:#a4b0c2;--ln:#2a3c5c;--bl:#243450;--b2:#38517c;--ok:#4fd1bf;--wn:#e8b04a;--bd:#ff7a9c}}
:root[data-theme=dark]{--bg:#131a27;--c:#1b273b;--ink:#f5f3ed;--mu:#a4b0c2;--ln:#2a3c5c;--bl:#243450;--b2:#38517c;--ok:#4fd1bf;--wn:#e8b04a;--bd:#ff7a9c}
*{box-sizing:border-box}html,body{height:auto}body{margin:0;font:15px/1.5 Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{margin:0 0 8px}a{color:var(--b);cursor:pointer}.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bd{color:var(--bd)}.wn{color:var(--wn)}.hide{display:none!important}
.hd{position:sticky;top:0;z-index:20;background:var(--c);border-bottom:2px solid var(--ln);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:21px;color:var(--ink)}.logo span{color:var(--b)}.sp{flex:1}
.nav{display:flex;gap:4px;flex-wrap:wrap}.nav button{border:0;background:none;color:var(--mu);font:700 13px Poppins;padding:7px 11px;border-radius:12px;cursor:pointer}.nav button.on{background:var(--bl);color:var(--b)}
.sh{display:grid;grid-template-columns:210px minmax(0,1fr)}.sd{padding:14px 10px;border-right:2px solid var(--ln);display:grid;align-content:start;gap:3px;min-height:calc(100vh - 58px)}.sd button{text-align:left;border:0;background:none;color:var(--ink);font:700 13px Poppins;padding:9px 12px;border-radius:12px;cursor:pointer}.sd button.on{background:var(--bl);color:var(--b)}
@media(max-width:800px){.sh{grid-template-columns:1fr}.sd{display:flex;overflow-x:auto;border-right:0;border-bottom:2px solid var(--ln);min-height:0}.sd button{white-space:nowrap}}
main{padding:18px;max-width:1150px;margin:0 auto;width:100%}
.card{background:var(--c);border:2px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px}
.btn,.chip{font:700 13px Poppins;border:2px solid var(--ln);background:var(--c);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer}.btn.p,.chip.on{background:var(--b);border-color:var(--b);color:#fff}.btn.d{color:var(--bd);border-color:var(--bd)}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:2px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink)}input[type=checkbox]{width:auto}

 if(!/^\d{13}$/.test(t(c.nib)))miss.push("NIB (13 digit)");
 if(t(c.addr).length<5)miss.push("alamat");
 if(!t(c.field))miss.push("bidang usaha");
 if(!t(c.pic))miss.push("penanggung jawab");
 if(!t(c.pos))miss.push("jabatan");
 if(String(t(c.hp)).replace(/\D/g,"").length<8)miss.push("nomor HP");
 if(!d.nib)miss.push("dokumen NIB");
 if(!d.ktp)miss.push("KTP / surat tugas");
 return{ok:!miss.length,miss}};

 const o={};String(t||"").split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).slice(0,40).forEach(x=>{
  const m=x.match(/^(.+?)\s*\((.+?)\)\s*$/),nm=(m?m[1]:x).trim().slice(0,40),lv=m?m[2].trim().slice(0,20):"✓";
  if(!nm||nm==="__proto__")return;o[canon[nm.toLowerCase()]||nm]=lv||"✓"});return o};

window.recJobs=n=>{const fl=j=>(co(j.co)||{}).field||"Lainnya",seed=[...String(S.id)].reduce((a,x)=>a+x.charCodeAt(0),0),
 h=j=>{let x=0;for(const ch of String(j.id)+seed)x=(x*31+ch.charCodeAt(0))>>>0;return x},
 L=db.jobs.filter(live).sort((a,b)=>score(b)-score(a)||h(a)-h(b)),by={};
 L.forEach(j=>(by[fl(j)]=by[fl(j)]||[]).push(j));
 const G=Object.values(by).sort((a,b)=>score(b[0])-score(a[0])||h(a[0])-h(b[0])),out=[];
 for(let r=0;out.length<n&&r<4;r++)for(const g of G)if(g[r]&&out.length<n)out.push(g[r]);
 const it=L.find(j=>fl(j)==="Teknologi");if(it&&n>=5&&out.length>=n&&!out.some(j=>fl(j)==="Teknologi"))out[out.length-1]=it;return out};

<script>
/* Kuota paket: satu sumber untuk semua batas fitur (iklan, screening, undangan). */
const QT={gratis:{n:"Gratis",ads:5,sq:3,inv:5,dur:15},bisnis:{n:"Bisnis",ads:20,sq:5,inv:30,dur:45},pro:{n:"Pro",ads:Infinity,sq:10,inv:100,dur:60}};
const quotaOf=e=>{const c=co(e)||{},on=!!(c.plan&&QT[c.plan]&&c.planEnd>Date.now()),k=on?c.plan:"gratis";return{...QT[k],k,on,end:on?c.planEnd:0}};
const qLim=v=>v===Infinity?"\u221e":String(v);
const qAds=Q=>Q.ads===Infinity?"iklan aktif tanpa batas":Q.ads+" iklan aktif";
const qFull=Q=>"Kuota "+qAds(Q)+" paket "+Q.n+" sudah terpakai. Tutup satu iklan atau upgrade di menu Paket & pembayaran.";
const liveAds=e=>db.jobs.filter(j=>j.co===e&&live(j)).length;

</script>
<script>

const addMon=(t,m)=>{const d=new Date(t),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getTime()};
const fmtD=t=>new Date(t).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const dLeft=t=>Math.max(0,Math.ceil((t-Date.now())/864e5));
const adDur=e=>{try{return quotaOf(e).dur}catch(_){return 30}};
const applyPlan=(c,x)=>{const now=Date.now(),same=c.plan===x.plan&&c.planEnd>now,from=same?c.planEnd:now;c.planStart=same?(c.planStart||now):now;c.plan=x.plan;c.planEnd=addMon(from,x.m);c.alr={};x.ps=from;x.pe=c.planEnd};
const pkBadge=e=>{try{const k=quotaOf(e).k;return k==="gratis"?"":'<em class="pkb '+k+'">'+(k==="pro"?"★ PRO":"✔ BISNIS")+'</em>'}catch(_){return""}};

 gratis:["5 iklan aktif","Masa tayang tiap iklan 15 hari","3 pertanyaan screening per iklan","5 undangan kandidat per hari","ATS, Talent Pool, dan Talent Search dasar","Laporan rekrutmen ringkas"],

function planAlerts(e){const c=co(e)||{},Q=quotaOf(e),now=Date.now(),L=[];
 if(Q.on){const d=dLeft(Q.end);if(d<=7)L.push({k:"pe"+Q.end,l:"w",b:1,t:"Paket "+Q.n+" hampir habis: "+(d<=0?"berakhir hari ini":d===1?"berakhir besok":"sisa "+d+" hari")+" (berakhir "+fmtD(Q.end)+"). Perpanjang agar badge, sorotan, dan kuota tidak turun ke Gratis."})}
 else if(c.plan&&QT[c.plan]&&c.planEnd&&c.planEnd<=now)L.push({k:"px"+c.planEnd,l:"d",b:1,t:"Paket "+QT[c.plan].n+" sudah habis sejak "+fmtD(c.planEnd)+". Akun kembali ke paket Gratis ("+QT.gratis.ads+" iklan aktif). Iklan yang sedang tayang tetap jalan sampai masa tayangnya selesai."});
 const u=liveAds(e);
 if(Q.ads!==Infinity){if(u>=Q.ads)L.push({k:"af",l:"d",b:Q.k!=="pro",t:"Kuota iklan paket "+Q.n+" habis ("+u+"/"+Q.ads+"). Tutup satu iklan atau upgrade paket untuk memasang iklan baru."});else if(u>=Math.ceil(Q.ads*.8))L.push({k:"an",l:"w",b:1,t:"Kuota iklan paket "+Q.n+" hampir habis ("+u+"/"+Q.ads+")."})}
 const inv=db.cr.filter(r=>r.co===e&&r.t>now-864e5).length;if(inv>=Q.inv)L.push({k:"iv",l:"w",b:1,t:"Batas undangan kandidat paket "+Q.n+" tercapai ("+inv+"/"+Q.inv+" dalam 24 jam terakhir)."});
 const soon=db.jobs.filter(j=>j.co===e&&live(j)&&dLeft(j.end)<=3).length;if(soon)L.push({k:"js"+soon,l:"w",b:0,t:soon+" iklan akan berakhir dalam 3 hari. Tekan tombol Up ulang agar tetap tayang."});
 return L}
function alertsHtml(e,push,btn){let L=[];try{L=planAlerts(e)}catch(_){return""}
 if(push){try{const c=co(e);if(c){const a=c.alr||(c.alr={}),now=new Set(L.map(x=>x.k));let ch=0;L.forEach(x=>{if(!a[x.k]){a[x.k]=1;note(e,(x.l==="d"?"⛔ ":"⚠️ ")+x.t);ch=1}});Object.keys(a).forEach(k=>{if(!now.has(k)){delete a[k];ch=1}});if(ch)sv()}}catch(_){}}
 return L.map(x=>'<div class="pal '+x.l+'"><span>'+(x.l==="d"?"⛔":"⚠️")+'</span><span style="flex:1;min-width:200px">'+E(x.t)+'</span>'+(x.b&&btn?'<button class="btn p" data-a="nav" data-i="plan">Lihat paket</button>':"")+'</div>').join("")}

const live=j=>!j.off&&j.end>Date.now()&&co(j.co)?.st==="ok",cvOf=e=>db.cv[e]||(db.cv[e]={sum:"",city:"",link:"",sk:{},edu:[],exp:[],proj:[],cert:[],lang:[],pref:{sal:"",loc:"",type:""}});

<section id="hm-tentang" class="hm-sec"><h2>Tentang Kami</h2><p class="hm-lead">KaryMatch adalah platform lowongan kerja yang mempertemukan pencari kerja dengan perusahaan yang sudah terverifikasi. Kami ingin proses melamar kerja lebih jelas, lebih aman, dan tidak membuang waktu: skill yang cocok langsung terlihat, status lamaran bisa dipantau, dan jadwal interview diatur rapi di satu tempat.</p><div class="hm-feat"><div class="card"><div class="hm-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><b>Perusahaan terverifikasi</b><div class="mu">Setiap perusahaan diperiksa admin sebelum boleh memasang lowongan, untuk mencegah penipuan.</div></div><div class="card"><div class="hm-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></div><b>Skor kecocokan skill</b><div class="mu">Lihat seberapa cocok CV kamu dengan tiap lowongan sebelum melamar.</div></div><div class="card"><div class="hm-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><b>Interview terjadwal</b><div class="mu">Konfirmasi jadwal, dapat pengingat, dan file kalender langsung dari aplikasi.</div></div></div></section>
<section id="hm-cara" class="hm-sec"><h2>Cara Kerja</h2><p class="hm-lead">Empat langkah dari daftar sampai interview.</p><div class="hm-feat"><div class="card"><div class="hm-ic">1</div><b>Daftar & buat CV</b><div class="mu">Masuk dengan email dan kode OTP, lalu isi skill dan pengalamanmu.</div></div><div class="card"><div class="hm-ic">2</div><b>Cari & lamar</b><div class="mu">Telusuri lowongan, lalu lamar dengan satu klik.</div></div><div class="card"><div class="hm-ic">3</div><b>Pantau status</b><div class="mu">Dikirim, ditinjau, interview, hingga penawaran: semua tahap terlihat.</div></div><div class="card"><div class="hm-ic">4</div><b>Interview</b><div class="mu">Terima undangan, konfirmasi, dan datang sesuai jadwal.</div></div></div></section>

ver(){return window.tkVer()},
cj(){const js=db.jobs.filter(j=>j.co===S.id);return`<h2>Kelola lowongan</h2><div class="fl"><button class="btn p" data-a="nj">+ Lowongan baru</button><span class="mu">Hanya perusahaan terverifikasi. Kuota ${qAds(quotaOf(S.id))}.</span></div>${js.map(j=>`<div class="card">${poster(j)}<div class="fl" style="margin-top:8px"><b>${E(j.t)}</b> ${live(j)?'<span class="ok">aktif</span>':j.end<=Date.now()?'<span class="bd">berakhir · tersimpan</span>':'<span class="bd">tidak tayang</span>'}<span class="sp"></span>${j.end<=Date.now()?'<span class="bd" title="Masa tayang habis">🔒 Arsip</span>':`<button class="btn" data-a="ej" data-i="${j.id}">Edit</button>`}<button class="btn" data-a="dj" data-i="${j.id}">Duplikat</button><button class="btn" data-a="xj" data-i="${j.id}">Up ulang · ${adDur(S.id)} hari</button><button class="btn d" data-a="cj" data-i="${j.id}">Tutup</button></div></div>`).join("")}`},

chat(){return`<h2>Chat dengan pelamar</h2>${coApps().map(a=>chatBox(a.id)).join("")||'<div class="card mu">Chat hanya ada di dalam lamaran; perusahaan tidak bisa mengirim pesan ke pekerja yang belum melamar.</div>'}`},net:netPg,
help(){const t=db.tix.filter(x=>x.by===S.id);return`<h2>Tiket bantuan ke admin</h2><button class="btn p" data-a="nt">+ Tiket baru</button>${t.map(x=>`<div class="card"><b>${E(x.sub)}</b> · ${x.st}<div>${E(x.txt)}</div>${x.rep?`<div class="ok">Admin: ${E(x.rep)}</div>`:""}</div>`).join("")}`},notes:notesPg},
admin:{
dash(){return`<h2>Dasbor admin</h2><div class="two"><div class="card">${db.cos&&Object.values(db.cos).filter(c=>c.st==="menunggu").length} verifikasi menunggu</div><div class="card">${db.reports.filter(r=>r.st==="baru").length} laporan baru · ${db.tix.filter(t=>t.st==="terbuka").length} tiket terbuka</div></div><div class="card">${db.sec.filter(s=>s.k!=="info").slice(0,3).map(s=>`<div class="wn">${fd(s.t)}: ${E(s.txt)}</div>`).join("")||"Tidak ada kejadian keamanan."}</div>`},
ver(){return`<h2>Antrean verifikasi perusahaan</h2>${Object.entries(db.cos).filter(([e,c])=>c.st==="menunggu").map(([e,c])=>{const dup=Object.entries(db.cos).some(([k,x])=>k!==e&&x.nib===c.nib),auto=[[/^\d{13}$/.test(c.nib),"NIB 13 digit"],[!dup,"NIB belum dipakai akun lain"],[c.docs.nib&&c.docs.ktp,"Dokumen lengkap, jenis dan ukuran sesuai"]],mine=c.by===S.id;return`<div class="card"><b>${E(c.name)}</b> · ${E(c.field)}<div>NIB ${E(c.nib)} · ${E(c.addr)}</div><div>PJ: ${E(c.pic)}, ${E(c.pos)}, ${E(c.hp)}</div><div class="mu">Dokumen (privat): ${E(c.docs.nib)}, ${E(c.docs.ktp)}</div>${auto.map(([o,l])=>`<div class="${o?"ok":"bd"}">${o?"✔":"✗"} ${l}</div>`).join("")}${c.by&&!mine?`<div class="wn">Sedang diproses ${c.by}</div>`:!c.by?`<button class="btn p" data-a="take" data-i="${e}">Ambil</button>`:`<label style="margin-top:6px"><span><input type="checkbox" id="m1"> Nama di dokumen cocok dengan data usaha</span></label><label><span><input type="checkbox" id="m2"> NIB dicek di OSS pemerintah</span></label><div class="fl" style="margin-top:8px"><button class="btn p" data-a="apv" data-i="${e}">Setujui</button><button class="btn d" data-a="rej" data-i="${e}">Tolak</button></div>`}</div>`}).join("")||'<div class="card mu">Antrean kosong.</div>'}`},
rep(){return`<h2>Laporan lowongan dan pesan</h2>${db.reports.map(r=>`<div class="card"><b>${r.type}</b> · ${r.st}${r.by2?` oleh ${r.by2}`:""}<div>${E(r.reason)}</div><div class="mu">Pelapor: ${E(r.by)}</div><div class="fl" style="margin-top:6px">${r.type==="pesan"?`<button class="btn" data-a="rview" data-i="${r.id}">Baca percakapan dilaporkan</button>`:""}${r.st==="baru"?`<button class="btn p" data-a="rtake" data-i="${r.id}">Ambil</button>`:r.by2===S.id&&r.st==="diproses"?`<button class="btn p" data-a="rdone" data-i="${r.id}" data-k="ok">Tindak lanjuti</button><button class="btn" data-a="rdone" data-i="${r.id}" data-k="no">Tolak laporan</button>`:""}</div></div>`).join("")||'<div class="card mu">Belum ada laporan.</div>'}`},
usr(){return`<h2>Kelola pengguna</h2>${tbl(["Email","Nama","Peran","Aksi"],db.users.map(u=>[E(u.e),E(u.name),u.role,`<button class="btn ${db.susp[u.e]?"":"d"}" data-a="susp" data-i="${u.e}">${db.susp[u.e]?"Aktifkan":"Tangguhkan"}</button>`]))}<div class="mu">Tidak ada fitur menghapus atau mengganti sandi admin lain dari panel.</div>`},
jobs(){return`<h2>Kelola lowongan</h2>${tbl(["Lowongan","Perusahaan","Status","Aksi"],db.jobs.map(j=>[E(j.t),E(co(j.co).name),live(j)?"aktif":"tidak tayang",`<button class="btn d" data-a="adown" data-i="${j.id}">Turunkan</button>`]))}`},
tix(){return`<h2>Tiket bantuan</h2>${db.tix.map(x=>`<div class="card"><b>${E(x.sub)}</b> · ${x.st} · ${E(x.by)}<div>${E(x.txt)}</div>${x.rep?`<div class="ok">Balasan: ${E(x.rep)}</div>`:`<button class="btn p" data-a="trep" data-i="${x.id}">Balas & tutup</button>`}</div>`).join("")||'<div class="card mu">Belum ada tiket.</div>'}`},
mst(){return`<h2>Master data</h2><div class="two"><div class="card"><b>Bidang usaha</b>${db.fields.map(f=>`<div>${f}</div>`).join("")}<button class="btn" data-a="mad" data-k="fields">+ Tambah</button></div><div class="card"><b>Skill</b><div class="tg">${db.skills.map(f=>`<i>${f}</i>`).join("")}</div><button class="btn" data-a="mad" data-k="skills">+ Tambah</button></div></div>`},
log(){return`<h2>Log aktivitas admin</h2>${tbl(["Waktu","Admin","Aksi"],db.logs.map(l=>[fd(l.t),l.by,E(l.a)]))}`},
sec(){return`<h2>Keamanan login</h2><div class="mu">Notifikasi ke kedua admin hanya untuk kejadian penting.</div>${tbl(["Waktu","Jenis","Keterangan","Akun"],db.sec.slice(0,60).map(s=>[fd(s.t),s.k==="info"?"catatan":"<b class='bd'>PENTING</b>",E(s.txt),E(s.who)]))}`},
stat(){const n=[["Pengguna",db.users.length],["Perusahaan terverifikasi",Object.values(db.cos).filter(c=>c.st==="ok").length],["Lowongan aktif",db.jobs.filter(live).length],["Lamaran",db.apps.length],["Interview",db.ivs.length],["Laporan",db.reports.length]],mx=Math.max(...n.map(x=>x[1]),1);return`<h2>Statistik</h2><div class="card">${n.map(([l,v])=>`<div>${l}: <b>${v}</b><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join("")}</div>`}}};

<script>(()=>{
/* ---------- isi kontak (data contoh) ---------- */
KONTAK.email="support@karymatch.id";KONTAK.wa="0800-1234-5678";KONTAK.alamat="Jl. Malioboro, Yogyakarta";
const rp=n=>"Rp "+n.toLocaleString("id-ID");
const I=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const D=(a,b)=>`<details class="fq"><summary>${a}</summary><p>${b}</p></details>`;

/* ---------- Halaman hukum & info (terpisah) ---------- */
const sec=(t,c)=>`<h3>${t}</h3>${c}`;
const ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const note="<p class='mu' style='margin-top:26px'>Terakhir diperbarui: 28 Oktober 2026. Dokumen ini contoh untuk demo dan perlu ditinjau ahli hukum sebelum dipakai secara resmi.</p>";
window.__PG={
"Tentang":()=>`<p>KaryMatch adalah platform lowongan kerja yang mempertemukan pencari kerja dengan perusahaan yang sudah terverifikasi. Kami ingin proses melamar kerja lebih jelas, lebih aman, dan tidak membuang waktu.</p>`+sec("Misi kami",ul(["Memastikan setiap lowongan berasal dari perusahaan yang sudah diperiksa admin.","Membuat kecocokan skill terlihat sebelum melamar.","Membuat status lamaran dan jadwal interview transparan untuk kedua pihak.","Menjaga data pribadi pencari kerja tetap aman."]))+sec("Yang kami tawarkan",`<p><b>Untuk pencari kerja:</b> CV online, skor kecocokan skill, lamaran satu klik, pelacak status, chat per lamaran, dan jadwal interview dengan pengingat. Semuanya gratis.</p><p><b>Untuk perusahaan:</b> pasang iklan, pertanyaan screening, Applicant Tracking System, Talent Search, Talent Pool, Job Invitation, dan Career Page.</p>`)+sec("Angka saat ini",`<p>${db.users.filter(u=>u.role==="pekerja").length} pencari kerja terdaftar, ${Object.values(db.cos).filter(c=>c.st==="ok").length} perusahaan terverifikasi, dan ${db.jobs.filter(live).length} lowongan aktif.</p>`)+sec("Hubungi kami",`<p>Email <a href="mailto:${KONTAK.email}">${KONTAK.email}</a> · WhatsApp ${KONTAK.wa}</p>`),
"Kebijakan privasi":()=>`<p>Kebijakan ini menjelaskan data apa yang dikumpulkan KaryMatch, untuk apa dipakai, dan hak Anda atas data tersebut.</p>`+sec("1. Data yang kami kumpulkan",ul(["Data akun: nama, email, dan kata sandi (disimpan dalam bentuk hash).","Data CV: ringkasan, pendidikan, pengalaman, skill, dan preferensi kerja.","Data perusahaan: nama, bidang, alamat, NIB, dan identitas penanggung jawab untuk verifikasi.","Aktivitas: lamaran, jadwal interview, pesan di dalam lamaran, dan log keamanan login."]))+sec("2. Cara kami memakai data",ul(["Menjalankan proses rekrutmen: melamar, menilai, dan menjadwalkan interview.","Menghitung skor kecocokan skill.","Memverifikasi perusahaan dan mencegah penipuan.","Mengirim notifikasi dan pengingat yang terkait akun Anda."]))+sec("3. Yang tampil ke publik",`<p>NIK, alamat lengkap, nomor HP, email, serta foto ijazah dan KTP tidak pernah ditampilkan ke publik. Di Talent Search, nama Anda tampil bagi perusahaan terverifikasi.</p>`)+sec("4. Berbagi data",`<p>CV hanya dibagikan ke perusahaan yang Anda lamar atau yang undangannya Anda terima. Kami tidak menjual data pribadi.</p>`)+sec("5. Keamanan",`<p>Akses admin dilindungi verifikasi dua langkah, dan kejadian penting dicatat di log keamanan. Walau begitu, tidak ada sistem yang sepenuhnya bebas risiko.</p>`)+sec("6. Hak Anda",ul(["Melihat dan memperbarui data CV kapan saja.","Menghentikan tayang profil Talent Search kapan saja.","Memblokir perusahaan yang mengirim undangan.","Meminta penghapusan akun lewat <a href='mailto:"+KONTAK.email+"'>"+KONTAK.email+"</a>."]))+sec("7. Penyimpanan",`<p>Data disimpan selama akun aktif dan sesuai kebutuhan hukum. Setelah akun dihapus, data pribadi dihapus atau dianonimkan.</p>`)+note,
"Syarat layanan":()=>`<p>Dengan memakai KaryMatch, Anda menyetujui syarat berikut.</p>`+sec("1. Akun",ul(["Anda wajib memberi data yang benar dan menjaga kerahasiaan kata sandi dan kode OTP.","Satu orang atau satu perusahaan hanya boleh memiliki satu akun.","Akun yang melanggar syarat dapat ditangguhkan oleh admin."]))+sec("2. Pencari kerja",ul(["Layanan gratis. KaryMatch tidak pernah meminta biaya, transfer, atau OTP.","Anda bertanggung jawab atas kebenaran isi CV dan jawaban screening.","Satu lamaran per lowongan."]))+sec("3. Perusahaan",ul(["Perusahaan wajib lolos verifikasi sebelum memasang lowongan.","Lowongan harus nyata, jelas, dan tidak meminta biaya dari pelamar.","Kuota iklan aktif dan jumlah undangan harian mengikuti paket yang dipakai.","Data kandidat hanya boleh dipakai untuk keperluan rekrutmen."]))+sec("4. Yang dilarang",ul(["Memasang lowongan palsu atau menyesatkan.","Meminta uang, OTP, atau data sensitif yang tidak perlu.","Mengirim pesan spam atau melecehkan.","Mencoba mengakses area atau data yang bukan hak Anda."]))+sec("5. Laporan dan penindakan",`<p>Gunakan tombol Laporkan untuk lowongan atau pesan yang mencurigakan. Admin dapat menurunkan lowongan dan menangguhkan akun yang melanggar.</p>`)+sec("6. Batas tanggung jawab",`<p>KaryMatch mempertemukan pencari kerja dan perusahaan, tetapi tidak menjamin hasil seleksi. Keputusan merekrut sepenuhnya ada pada perusahaan.</p>`)+sec("7. Perubahan syarat",`<p>Syarat dapat diperbarui sewaktu-waktu. Perubahan penting akan diberitahukan lewat notifikasi.</p>`)+note,
"Kontak":()=>`<p>Tim kami siap membantu pada hari kerja.</p><div class="card"><b>✉ Email</b><div><a href="mailto:${KONTAK.email}">${KONTAK.email}</a></div></div><div class="card"><b>💬 WhatsApp Support</b><div>${KONTAK.wa}</div></div><div class="card"><b>📞 Call Center</b><div>0800-1234-5679</div></div><div class="card"><b>📍 Alamat</b><div>${KONTAK.alamat}</div></div><div class="card"><b>🕘 Jam layanan</b><div>Senin–Jumat, 08.00–17.00 WIB</div></div><p class="mu">Data kontak di atas adalah contoh untuk demo.</p><div class="scam">KaryMatch tidak pernah meminta transfer uang, password, atau OTP.</div>`,
"Pusat bantuan":()=>`<p>Temukan jawaban cepat di bawah. Masih butuh bantuan? Hubungi <a href="mailto:${KONTAK.email}">${KONTAK.email}</a>.</p>`+sec("Pencari kerja",D("Bagaimana cara melamar?","Buka lowongan, pastikan CV terisi, lalu tekan Lamar. Jika lowongan punya pertanyaan screening, jawab dulu sebelum lamaran terkirim.")+D("Di mana saya melihat status lamaran?","Buka menu Riwayat lamaran. Tahap lamaran tampil sebagai garis langkah dari Dikirim sampai Diterima.")+D("Saya lupa kata sandi","Di halaman masuk, isi email lalu pilih Lupa kata sandi. Anda akan menerima kode OTP untuk membuat sandi baru.")+D("Apa itu Talent Search?","Fitur untuk menayangkan profil singkat agar perusahaan terverifikasi bisa mengundang Anda. Nama Anda tampil bagi perusahaan terverifikasi."))+sec("Perusahaan",D("Bagaimana verifikasi perusahaan?","Lengkapi profil, unggah NIB dan KTP penanggung jawab, lalu tunggu review admin.")+D("Berapa iklan yang boleh tayang?","Paket Gratis mengizinkan 5 iklan aktif. Iklan bisa diperpanjang 30 hari.")+D("Bagaimana cara menyimpan kandidat?","Dari papan ATS atau Talent Search, tekan + Talent Pool.")+D("Bagaimana mengundang kandidat?","Buka Talent Search, pilih kandidat, lalu tekan Undang. Batas undangan 5 per hari pada paket Gratis."))+sec("Keamanan",D("Saya menemukan lowongan mencurigakan","Tekan Laporkan pada lowongan itu. Admin akan memeriksanya.")+D("Apakah ada biaya untuk pelamar?","Tidak. Jika ada yang meminta uang, transfer, atau OTP, jangan layani dan laporkan.")),
"Blog":()=>[["5 tips menulis CV yang lolos seleksi","Mulai dari ringkasan dua kalimat yang menyebut posisi yang Anda tuju. Tulis pengalaman dengan hasil yang bisa diukur, misalnya jumlah pelanggan yang dilayani. Cantumkan skill yang sesuai dengan lowongan, bukan semua yang Anda bisa. Pakai satu halaman, format rapi, lalu minta teman membaca ulang sebelum dikirim."],["Cara mengenali lowongan palsu","Waspadai lowongan yang meminta uang pendaftaran, transfer, password, atau kode OTP. Perusahaan sungguhan tidak meminta itu. Cek apakah perusahaannya punya tanda terverifikasi, alamat jelas, dan kontak resmi. Kalau ragu, laporkan ke admin lewat tombol Laporkan."],["Persiapan interview online","Uji kamera, mikrofon, dan koneksi 15 menit sebelum mulai. Pilih tempat tenang dengan cahaya cukup. Pelajari profil perusahaan dan siapkan dua pertanyaan untuk pewawancara. Konfirmasi jadwal di KaryMatch agar pengingat H-1 dan 2 jam sebelumnya aktif."],["Cara membaca skor kecocokan skill","Skor menunjukkan berapa persen skill yang diminta lowongan sudah ada di CV Anda. Skor rendah bukan berarti tidak boleh melamar, tetapi tunjukkan kemauan belajar di ringkasan CV. Perbarui skill setelah ikut kursus supaya rekomendasi ikut membaik."],["Tips menjawab pertanyaan screening","Jawab jujur dan singkat. Pertanyaan screening dipakai perusahaan untuk menyaring syarat dasar seperti lokasi dan ketersediaan mulai kerja. Jawaban yang tidak cocok tetap bisa dikirim, tetapi perusahaan akan melihatnya di ATS."],["Memulai karier sebagai fresh graduate","Cari lowongan berlabel Ramah fresh graduate, isi bagian proyek dan magang di CV, dan lampirkan tautan portofolio. Mulai dari posisi yang skill dasarnya sudah Anda kuasai, lalu naik bertahap."]].map(x=>`<div class="post"><h3>${x[0]}</h3><p style="margin:0">${x[1]}</p></div>`).join(""),
"Karier":()=>`<p>Bergabung membangun cara baru mempertemukan pencari kerja dan perusahaan.</p>`+[["Frontend Engineer","Bandung / Remote","HTML, CSS, JavaScript, React"],["Backend Engineer","Jakarta / Remote","API, SQL, keamanan"],["Customer Success Associate","Jakarta","Komunikasi, Administrasi"],["Content Writer","Remote","Content, SEO"],["Trust & Safety Analyst","Jakarta","Verifikasi, analisis laporan"]].map(x=>`<div class="card"><b>${x[0]}</b><div class="mu">${x[1]} · ${x[2]}</div></div>`).join("")+`<p class="mu">Kirim CV ke <a href="mailto:karier@karymatch.id">karier@karymatch.id</a> dengan judul posisi yang dituju.</p>`
};

const jcx=j=>`<div class="jx">${coLogo(co(j.co).name,48)}<div style="flex:1;min-width:0"><h3>${E(j.t)}</h3><div class="mu"><span class="ok">✔</span> ${E(co(j.co).name)} · ${E(j.city)} · ${j.ty}</div><div class="tg">${labels(j).map(l=>`<i class="n">${l}</i>`).join("")}${j.sk.map(s=>`<i>${E(s)}</i>`).join("")}</div><div class="jf"><b>${gaji(j)}</b><button class="bb sm" data-a="lgo">Lamar</button></div></div></div>`;
